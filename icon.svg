<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#044E39" />
    </linearGradient>
    <linearGradient id="needleGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="needleGradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#34D399" stroke-width="12" stroke-opacity="0.8" />
  
  <!-- Dashed Track Ring -->
  <circle cx="256" cy="256" r="145" fill="none" stroke="#A7F3D0" stroke-width="4" stroke-dasharray="12 12" stroke-opacity="0.6" />

  <!-- Compass / Diamond Needle Top -->
  <polygon points="256,96 312,256 256,256" fill="url(#needleGradTop)" />
  <polygon points="256,96 200,256 256,256" fill="#F8FAFC" />

  <!-- Compass / Diamond Needle Bottom -->
  <polygon points="256,416 312,256 256,256" fill="url(#needleGradBottom)" />
  <polygon points="256,416 200,256 256,256" fill="#10B981" />

  <!-- Center Pin -->
  <circle cx="256" cy="256" r="28" fill="#065F46" />
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" />
</svg>
